apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: cd-demo}
  template:
    metadata:
      labels: {app: cd-demo}
    spec:
      containers:
        - name: cd-demo
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
